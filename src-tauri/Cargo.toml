[package]
name = "codexpet"
version = "0.1.0"
description = "A Windows desktop pet for local Codex task status"
authors = ["CodexPet contributors"]
edition = "2021"
default-run = "codexpet"

[[bin]]
name = "codexpet"
path = "src/main.rs"

[lib]
name = "codexpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
